apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gocheaper-ingress
  namespace: gocheaper
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Sticky sessions for Blazor Server SignalR
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "BLAZOR_STICKY"
    nginx.ingress.kubernetes.io/session-cookie-expires: "86400"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Strict"
    # Increase timeouts for long-lived SignalR WebSocket connections
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # Enable WebSocket upgrade
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # TLS / Let's Encrypt
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - gocheaper.dk
    - www.gocheaper.dk
    secretName: gocheaper-tls
  rules:
  - host: gocheaper.dk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
  - host: www.gocheaper.dk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
