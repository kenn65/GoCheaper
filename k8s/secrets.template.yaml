# Copy this file to secrets.yaml, fill in all values, then run:
#   kubectl apply -f k8s/secrets.yaml
# secrets.yaml is git-ignored — never commit it.
#
# Connection strings must include the sa password you choose for sql-sa-password.
# Use the same values as src/GoCheaper.AppHost/appsettings.Development.json.
apiVersion: v1
kind: Secret
metadata:
  name: gocheaper-secrets
  namespace: gocheaper
type: Opaque
stringData:
  sql-sa-password:       "REPLACE_ME_strong_password_1234!"
  jwt-key:               "REPLACE_ME_from_appsettings_Development_json"
  identity-api-key:      "REPLACE_ME"
  trips-api-key:         "REPLACE_ME"
  booking-api-key:       "REPLACE_ME"
  notification-api-key:  "REPLACE_ME"
  smtp-username:         "REPLACE_ME"
  smtp-password:         "REPLACE_ME"
  smtp-from-email:       "REPLACE_ME"
  # Connection strings — replace REPLACE_PASSWORD with the value from sql-sa-password above
  conn-identitydb: "Server=sqlserver,1433;Database=identitydb;User Id=sa;Password=REPLACE_PASSWORD;TrustServerCertificate=True"
  conn-tripsdb:    "Server=sqlserver,1433;Database=tripsdb;User Id=sa;Password=REPLACE_PASSWORD;TrustServerCertificate=True"
  conn-bookingdb:  "Server=sqlserver,1433;Database=bookingdb;User Id=sa;Password=REPLACE_PASSWORD;TrustServerCertificate=True"
  conn-webdb:      "Server=sqlserver,1433;Database=webdb;User Id=sa;Password=REPLACE_PASSWORD;TrustServerCertificate=True"
