apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-api
  namespace: gocheaper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-api
  template:
    metadata:
      labels:
        app: notification-api
    spec:
      containers:
      - name: notification-api
        image: gocheaperregistry.azurecr.io/notification-api:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: gocheaper-config
        env:
        - name: ApiKey__Value
          valueFrom:
            secretKeyRef:
              name: gocheaper-secrets
              key: notification-api-key
        - name: Smtp__Username
          valueFrom:
            secretKeyRef:
              name: gocheaper-secrets
              key: smtp-username
        - name: Smtp__Password
          valueFrom:
            secretKeyRef:
              name: gocheaper-secrets
              key: smtp-password
        - name: Smtp__FromEmail
          valueFrom:
            secretKeyRef:
              name: gocheaper-secrets
              key: smtp-from-email
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 30
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
